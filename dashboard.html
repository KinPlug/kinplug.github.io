          </tbody>

          </button>
          <button class="btn btn-secondary" onclick="KinPlug.signOut()">
            🚪 Sign Out

    </div>

          <option value="template-builder">Template Builder</option>

      </div>
      
      <div style="margin-bottom: 20px;">
