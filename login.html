<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In - KinPlug</title>
  <link rel="stylesheet" href="assets/css/style.css">
  
  <!-- Clerk - Replace pk_test_cHJvdmVuLXBpZ2xldC03MS5jbGVyay5hY2NvdW50cy5kZXYk
  <script 
    async 
    crossorigin="anonymous" 
    data-clerk-publishable-key="pk_test_cHJvdmVuLXBpZ2xldC03MS5jbGVyay5hY2NvdW50cy5kZXYk"
    src="https://cdn.jsdelivr.net/npm/@clerk/clerk-js@latest/dist/clerk.browser.js"
  ></script>
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <a href="/" class="logo">Kin<span>Plug</span></a>
      <h1>Welcome Back</h1>
      <p>Sign in to access your licenses and dashboard</p>
      
      <!-- Clerk Sign In Component -->
      <div id="clerk-auth">
        <div class="loading"><div class="spinner"></div></div>
      </div>
      
      <!-- Fallback for demo/development -->
      <div id="demo-auth" class="hidden" style="margin-top: 20px;">
        <div class="alert alert-warning">
          Clerk not configured. This is a demo mode.
        </div>
        <button class="btn btn-primary" onclick="demoSignIn()">Demo Sign In</button>
      </div>
      
      <p style="margin-top: 30px; font-size: 14px; color: #666;">
        Don't have an account? <a href="#" onclick="showSignUp()">Sign up</a>
      </p>
      
      <p style="margin-top: 20px;">
        <a href="/" style="font-size: 14px; color: #999;">← Back to Home</a>
      </p>
    </div>
  </div>

  <script>
    // Get redirect URL from query params
    const urlParams = new URLSearchParams(window.location.search);
    const redirectUrl = urlParams.get('redirect') || '/dashboard.html';
    
    // Initialize Clerk
    window.addEventListener('load', async () => {
      if (window.Clerk) {
        try {
          await window.Clerk.load();
          
          // Check if already signed in
          if (window.Clerk.user) {
            window.location.href = redirectUrl;
            return;
          }
          
          // Mount sign-in component
          const signInDiv = document.getElementById('clerk-auth');
          window.Clerk.mountSignIn(signInDiv, {
            afterSignInUrl: redirectUrl,
            afterSignUpUrl: redirectUrl,
            signUpUrl: '/login.html?mode=signup',
            appearance: {
              elements: {
                rootBox: {
                  width: '100%'
                },
                card: {
                  boxShadow: 'none',
                  border: 'none'
                }
              }
            }
          });
          
        } catch (err) {
          console.error('Clerk error:', err);
          showDemoMode();
        }
      } else {
        // Clerk not loaded, show demo mode after timeout
        setTimeout(() => {
          if (!window.Clerk) {
            showDemoMode();
          }
        }, 3000);
      }
    });
    
    function showDemoMode() {
      document.getElementById('clerk-auth').classList.add('hidden');
      document.getElementById('demo-auth').classList.remove('hidden');
    }
    
    function showSignUp() {
      if (window.Clerk && window.Clerk.openSignUp) {
        window.Clerk.openSignUp({
          afterSignUpUrl: redirectUrl
        });
      } else {
        alert('Please configure Clerk to enable sign up');
      }
    }
    
    function demoSignIn() {
      // For demo purposes, just redirect
      alert('Demo mode: In production, Clerk handles authentication.\n\nRedirecting to dashboard...');
      window.location.href = redirectUrl;
    }
  </script>
</body>
</html>
