<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ダッシュボード - KinPlug</title>
  <link rel="stylesheet" href="/assets/css/style.css">
  <script 
    async 
    crossorigin="anonymous" 
    data-clerk-publishable-key="pk_test_cHJvdmVuLXBpZ2xldC03MS5jbGVyay5hY2NvdW50cy5kZXYk"
    src="https://cdn.jsdelivr.net/npm/@clerk/clerk-js@latest/dist/clerk.browser.js"
    onload="window.Clerk && window.Clerk.load()"
  ></script>
</head>
<body>
  <nav class="navbar">
    <div class="container">
      <a href="/ja/" class="logo">Kin<span>Plug</span></a>
      <div class="nav-links">
        <a href="/ja/plugins/">プラグイン</a>
        <a href="/ja/pricing.html">料金</a>
        <a href="/ja/docs/">ドキュメント</a>
      </div>
      <div class="nav-right">
        <div class="lang-switcher">
          <a href="/dashboard.html">EN</a> | <a href="/ja/dashboard.html" class="active">日本語</a>
        </div>
        <div class="nav-auth">
          <div id="auth-nav">
            <button class="btn btn-ghost btn-sm" onclick="KinPlug.signIn()">ログイン</button>
            <button class="btn btn-primary btn-sm" onclick="KinPlug.signUp()">無料で始める</button>
          </div>
          <div id="user-nav" class="hidden">
            <div class="user-info" onclick="KinPlug.openProfile()" style="cursor:pointer;">
              <div id="user-avatar" class="user-avatar">?</div>
              <span id="user-name">User</span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </nav>

  <section class="dashboard">
    <div class="container">
      <div class="dashboard-header">
        <h1>ダッシュボード</h1>
        <button class="btn btn-primary" onclick="showStartTrialModal()">+ 新しいトライアルを開始</button>
      </div>

      <div class="dashboard-grid">
        <div class="stat-card">
          <h3>有効なライセンス</h3>
          <div id="stat-active" class="value success">-</div>
        </div>
        <div class="stat-card">
          <h3>トライアル中</h3>
          <div id="stat-trial" class="value warning">-</div>
        </div>
        <div class="stat-card">
          <h3>期限切れ</h3>
          <div id="stat-expired" class="value danger">-</div>
        </div>
      </div>

      <div class="licenses-section">
        <h2>ライセンス一覧</h2>
        <table class="license-table">
          <thead>
            <tr>
              <th>プラグイン</th>
              <th>ライセンスキー</th>
              <th>タイプ</th>
              <th>ステータス</th>
              <th>有効期限</th>
            </tr>
          </thead>
          <tbody id="licenses-table">
            <tr><td colspan="5"><div class="loading"><div class="spinner"></div></div></td></tr>
          </tbody>
        </table>
      </div>

      <div class="mt-40">
        <h2 style="margin-bottom: 20px;">クイックアクション</h2>
        <div style="display: flex; gap: 15px; flex-wrap: wrap;">
          <button class="btn btn-secondary" onclick="KinPlug.loadUserLicenses()">🔄 ライセンスを更新</button>
          <a href="/ja/docs/" class="btn btn-secondary">📖 ドキュメント</a>
          <a href="mailto:support@kinplug.com" class="btn btn-secondary">💬 サポート</a>
          <button class="btn btn-secondary" onclick="KinPlug.openProfile()">⚙️ アカウント設定</button>
          <button class="btn btn-secondary" onclick="KinPlug.signOut()">🚪 ログアウト</button>
        </div>
      </div>
    </div>
  </section>

  <div id="trial-modal" class="hidden" style="position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; z-index: 9999;">
    <div style="background: white; padding: 40px; border-radius: 12px; width: 100%; max-width: 450px;">
      <h2 style="margin-bottom: 20px;">無料トライアルを開始</h2>
      <div style="margin-bottom: 20px;">
        <label style="display: block; margin-bottom: 8px; font-weight: 600;">プラグインを選択</label>
        <select id="trial-plugin" style="width: 100%; padding: 12px; border: 1px solid #e0e0e0; border-radius: 8px; font-size: 16px;">
          <option value="pdf-designer">PDF Designer</option>
          <option value="enhanced-lookup">Enhanced Lookup</option>
          <option value="template-builder">Template Builder</option>
        </select>
      </div>
      <div style="margin-bottom: 20px;">
        <label style="display: block; margin-bottom: 8px; font-weight: 600;">kintoneサブドメイン</label>
        <div style="display: flex; align-items: center; border: 1px solid #e0e0e0; border-radius: 8px; overflow: hidden;">
          <input type="text" id="trial-subdomain" placeholder="mycompany" style="flex: 1; padding: 12px; border: none; font-size: 16px;">
          <span style="padding: 12px; background: #f8f9fa; color: #666;">.kintone.com</span>
        </div>
        <small style="color: #666; margin-top: 5px; display: block;">サブドメイン部分のみを入力してください</small>
      </div>
      <div style="display: flex; gap: 15px;">
        <button class="btn btn-primary" onclick="submitTrial()" style="flex: 1;">14日間無料で試す</button>
        <button class="btn btn-secondary" onclick="hideTrialModal()">キャンセル</button>
      </div>
    </div>
  </div>

  <footer class="footer">
    <div class="container">
      <div class="footer-bottom">
        <div>© 2026 KinPlug by Edamame Inc.</div>
        <div><a href="/">English</a> | <a href="/ja/">日本語</a></div>
      </div>
    </div>
  </footer>

  <script src="/assets/js/app.js"></script>
  <script>
    function showStartTrialModal() {
      document.getElementById('trial-modal').classList.remove('hidden');
    }
    function hideTrialModal() {
      document.getElementById('trial-modal').classList.add('hidden');
    }
    async function submitTrial() {
      const plugin = document.getElementById('trial-plugin').value;
      const subdomain = document.getElementById('trial-subdomain').value.trim();
      if (!subdomain) {
        alert('kintoneサブドメインを入力してください');
        return;
      }
      try {
        const result = await KinPlug.startTrial(plugin, subdomain);
        if (result && result.license_key) {
          hideTrialModal();
          KinPlug.loadUserLicenses();
          alert('トライアルを開始しました！ライセンスキー: ' + result.license_key);
        }
      } catch (err) {
        alert('エラー: ' + (err.message || 'トライアルの開始に失敗しました'));
      }
    }
  </script>
</body>
</html>
