<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <filter id="roughen" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="1.2"/>
    </filter>
    <radialGradient id="sealGrad" cx="50%" cy="45%">
      <stop offset="0%" stop-color="#C85A3B"/>
      <stop offset="80%" stop-color="#B23A2B"/>
      <stop offset="100%" stop-color="#8B2A1E"/>
    </radialGradient>
  </defs>
  <circle cx="32" cy="32" r="28" fill="url(#sealGrad)" filter="url(#roughen)"/>
  <circle cx="32" cy="32" r="26" fill="none" stroke="#F4EFE6" stroke-width="0.8" opacity="0.35"/>
  <text x="32" y="42" text-anchor="middle"
        font-family="'Fraunces', 'Shippori Mincho', serif"
        font-weight="500" font-size="30"
        fill="#F4EFE6" letter-spacing="0">K</text>
